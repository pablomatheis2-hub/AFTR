<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <title>AFTR OG Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    .gradient-ring {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, #FFB347 0deg, #FF6B6B 90deg, #C56CF0 180deg, #7F5AF0 270deg, #FFB347 360deg);
      opacity: 0.15;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(80px);
    }
    
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    
    .logo-container {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFB347 0%, #FF6B6B 50%, #C56CF0 100%);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-text {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 8px;
    }
    
    h1 {
      font-size: 72px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 12px;
      text-transform: uppercase;
    }
    
    .tagline {
      font-size: 28px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      max-width: 600px;
      text-align: center;
      line-height: 1.4;
    }
    
    .features {
      display: flex;
      gap: 40px;
      margin-top: 20px;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      font-weight: 500;
    }
    
    .feature-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    
    .url {
      position: absolute;
      bottom: 40px;
      font-size: 22px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 600;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="gradient-ring"></div>
  
  <div class="content">
    <h1>AFTR</h1>
    <p class="tagline">Todo empieza antes de entrar al club</p>
    <div class="features">
      <div class="feature">
        <span class="feature-icon">&#9728;</span>
        <span>Previas</span>
      </div>
      <div class="feature">
        <span class="feature-icon">&#9790;</span>
        <span>Afters</span>
      </div>
      <div class="feature">
        <span class="feature-icon">&#9733;</span>
        <span>Eventos</span>
      </div>
    </div>
  </div>
  
  <div class="url">aftr.es</div>
</body>
</html>
